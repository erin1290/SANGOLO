<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sangolo — espace d'écoute et de soutien pour adolescents au Cameroun.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sangolo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sangolo — On t'écoute</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { background: #FBF8F3; height: 100%; margin: 0; }
  </style>
</head>
<body>
  <script>
    window.addEventListener('error', function(e) {
      document.body.style.background = 'red';
      document.body.innerHTML = '<h1 style="color:white;padding:20px;">JS Error: ' + (e.message || 'unknown') + '<br>File: ' + (e.filename || '?') + '<br>Line: ' + (e.lineno || '?') + '</h1><pre>' + (e.error ? e.error.stack : 'no stack') + '</pre>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.style.background = 'orange';
      document.body.innerHTML = '<h1 style="color:white;padding:20px;">Unhandled Promise: ' + (e.reason || 'unknown') + '</h1><pre>' + (e.reason ? e.reason.stack : 'no stack') + '</pre>';
    });
  </script>
  <script src="flutter.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
