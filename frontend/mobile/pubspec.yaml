name: sangolo
description: Application de soutien psychologique pour adolescents au Cameroun.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0
  web_socket_channel: ^2.4.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.0
  record: ^5.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
